name: RELIVE validation - tests and debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relive-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify original Chama portrait
        run: bash RELIVE/scripts/verify-chama-portrait.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.2"

      - name: Run JVM unit tests
        run: gradle -p RELIVE testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle -p RELIVE assembleDebug --stacktrace

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relive-junit-reports
          path: RELIVE/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: relive-debug-apk
          path: RELIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
