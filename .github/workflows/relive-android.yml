name: RELIVE Android build
# Rebuild latest RELIVE app features and version 0.4.0

on:
  workflow_dispatch:

concurrency:
  group: relive-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Chama portrait and identity lock
        run: bash RELIVE/scripts/verify-chama-portrait.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # SDK Manager publishes API 37 as android-37.0; AGP resolves compileSdk 37 as android-37.
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.2"
      - name: Build RELIVE
        run: gradle -p RELIVE assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: relive-debug-apk
          path: RELIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
