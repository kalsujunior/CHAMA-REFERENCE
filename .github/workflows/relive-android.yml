name: RELIVE Android build

on:
  push:
    branches: [relive-app]
    paths:
      - "RELIVE/**"
      - ".github/workflows/relive-android.yml"
  pull_request:
    branches: [relive-app]
    paths:
      - "RELIVE/**"
      - ".github/workflows/relive-android.yml"
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build RELIVE
        run: gradle -p RELIVE assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: relive-debug-apk
          path: RELIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
